name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Compiles the native better-sqlite3 binding as part of install.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
