name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Compiles the native better-sqlite3 binding as part of install.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Informational only: next@14/nodemailer@8/vitest@2 currently carry
      # known advisories that only resolve via a major-version bump, which is
      # a deliberate, separately-tracked upgrade, not something a CI gate
      # should block every PR on. Surfaces new/transitive-dep regressions
      # without failing the build.
      - run: npm audit --audit-level=high
        continue-on-error: true
